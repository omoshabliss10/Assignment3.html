<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --bg-color:#6ef0a4;
            --text-color: #010243;
            --base-padding: 16px;
            --border-radius: 7px;
            --border: 17px;
        }
        body{
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: var(--base-padding);
            border-radius: var(--border-radius);
            border: var(--border);
            font-size: 50px;
        }
        .row{
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        ul{
            display: flex;
            flex-direction:row;
            flex-wrap: wrap;
            /* flex-wrap: wrap; */
            gap: 40px;
        }
    </style>
</head>
<body>
    <h1>Flex box</h1>
    <h3>Row</h3>
    <div class="row">
    
        <ul>
            <li>Monday</li>
            <li>Tuesday</li>
            <li>Wednesday</li>      
        </ul>
        </div>

    <h3>Column</h3>
    <div class="column">
        <ul>
        <li>Thursday</li>
        <li>Friday</li>
        <li>Saturday</li>  
        </ul>
        </div>

    

</body>
</html>
